<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Что показать?</title>
<link rel="stylesheet" href="../public/kui.css">
<style>
  /* те же цвета и элементы, что во всей Кентовке (тема подтягивается из настроек «Вид») */
  :root { --bg: #0a0b14; --panel: #11131f; --panel2: #171a2a; --panel3: #1e2236; --line: #262a40; --text: #e6e8ff; --dim: #8a8fb3; --faint: #5f6488;
    --accent: #22e1ff; --accent2: #ff3ec8; --acc-rgb: 34,225,255; --glow: .7; --font: "Segoe UI", system-ui, sans-serif; --font-display: Bahnschrift, "Segoe UI Semibold", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--panel); color: var(--text); font: 14px/1.4 var(--font); }
  body { display: flex; flex-direction: column; }
  header { padding: 18px 20px 8px; }
  h2 { margin: 0; font: 700 19px var(--font-display); }
  .ktabs { margin-top: 12px; }
  #grid { flex: 1; overflow-y: auto; padding: 12px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; align-content: start; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .src { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .src:hover { border-color: rgba(var(--acc-rgb), .45); }
  .src.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 calc(16px * var(--glow)) rgba(var(--acc-rgb), calc(.3 * var(--glow))); }
  .src img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 8px; display: block; }
  .src div { margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
  footer { padding: 14px 20px 18px; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--bg); }
  label { display: flex; gap: 9px; align-items: flex-start; flex: 1; min-width: 260px; cursor: pointer; }
  label input { accent-color: var(--accent); margin-top: 3px; width: 16px; height: 16px; }
  label small { display: block; color: var(--dim); font-size: 12.5px; }
  .qrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; }
  .qrow > span { color: var(--dim); font-size: 13px; }
  .kshareq { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .kshareq select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; outline: none; }
  .kshareq select:focus { border-color: var(--accent); }
  .kshareq-net { color: var(--dim); font-size: 12.5px; }
</style>
<script src="../public/kshare.js"></script>
</head>
<body>
<header>
  <h2>Что показать?</h2>
  <div class="ktabs"><button id="tScreen" class="on">Экраны</button><button id="tWin">Окна</button></div>
</header>
<div id="grid"></div>
<footer>
  <div class="qrow"><span>Качество:</span><div id="q"></div></div>
  <label><input type="checkbox" id="audio">
    <span>Со звуком системы
      <small id="audioHint">Зрители услышат игру, видео, музыку — всё, что играет на компе, кроме голосов из Кентовки.</small></span>
  </label>
  <button class="kbtn" id="cancel">Отмена</button>
  <button class="kbtn ok" id="ok" disabled>Показать</button>
</footer>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const A = window.kentovkaApp;
  // цвета из темы приложения
  try { const t = A.getTheme ? await A.getTheme() : null; if (t) { const r = document.documentElement.style; const hx = (h) => /^#[0-9a-f]{6}$/i.test(h || '') ? h : null;
    if (hx(t.accent)) { r.setProperty('--accent', t.accent); const n = parseInt(t.accent.slice(1), 16); r.setProperty('--acc-rgb', [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',')); }
    if (hx(t.accent2)) r.setProperty('--accent2', t.accent2); if (Number.isFinite(+t.glow)) r.setProperty('--glow', String(+t.glow)); } } catch {}
  const sources = await A.pickerSources();
  let tab = 'screen', sel = null;
  function render() {
    const grid = $('grid'); grid.innerHTML = '';
    sources.filter((s) => (tab === 'screen') === s.screen).forEach((s) => {
      const d = document.createElement('div'); d.className = 'src' + (sel === s.id ? ' sel' : '');
      const img = document.createElement('img'); img.src = s.thumb;
      const n = document.createElement('div'); n.textContent = s.name;
      d.append(img, n);
      d.onclick = () => { sel = s.id; $('ok').disabled = false; render(); };
      d.ondblclick = () => { sel = s.id; choose(); };
      grid.appendChild(d);
    });
  }
  const setTab = (t) => {
    tab = t; $('tScreen').classList.toggle('on', t === 'screen'); $('tWin').classList.toggle('on', t !== 'screen');
    // окно — только его звук: голоса из Discord и других звонилок в демку не попадут (иначе у кентов голос «двоится»)
    $('audioHint').textContent = t === 'screen'
      ? 'Весь звук компа, кроме Кентовки. Если сидишь ещё и в Discord — лучше показывай окно игры, иначе голоса оттуда попадут в демку.'
      : 'Только звук этого окна — игры, браузера, плеера. Голоса из Discord и других программ в демку не попадут.';
    render();
  };
  $('tScreen').onclick = () => setTab('screen');
  $('tWin').onclick = () => setTab('window');
  // качество перед показом — по умолчанию то, что выбирал в прошлый раз
  const pref = (A.shareGet ? await A.shareGet() : null) || { q: '1080_30', hint: 'auto' };
  const qc = window.kShareQ.controls(pref, () => {});
  $('q').appendChild(qc);
  const choose = () => { if (!sel) return; const c = qc.value(); A.pickerChoose({ id: sel, audio: $('audio').checked, q: c.q, hint: c.hint }); };
  $('ok').onclick = choose;
  $('cancel').onclick = () => A.pickerChoose(null);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') A.pickerChoose(null); if (e.key === 'Enter') choose(); });
  const screens = sources.filter((s) => s.screen);
  if (screens.length === 1) { sel = screens[0].id; $('ok').disabled = false; }
  setTab('screen');
})();
</script>
<script src="../public/kselect.js"></script>
</body>
</html>
