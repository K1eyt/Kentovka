<!doctype html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Кентовка — друзья</title>
<link rel="stylesheet" href="/kui.css">
<script src="/kchat.js"></script>
<script src="/kshare.js"></script>
<script src="/khelp.js"></script>
<style>
  :root {
    --bg: #0a0b14; --panel: #11131f; --panel2: #171a2a; --panel3: #1e2236; --line: #262a40;
    --text: #e6e8ff; --dim: #8a8fb3; --faint: #5d6286; --red: #ff4d6d; --green: #3cffa0; --yellow: #ffc94d;
    --accent: #22e1ff; --accent2: #ff3ec8; --acc-rgb: 34,225,255; --acc2-rgb: 255,62,200; --on-accent: #070812; --glow: .7;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --font-display: Bahnschrift, "DIN Alternate", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
    --t: .18s;
  }
  [data-motion="off"] { --t: 0s; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  body { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; outline: none; transition: border-color var(--t), box-shadow var(--t); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--acc-rgb), calc(.18 * var(--glow))); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; flex: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border-radius: 9px; font: 700 13.5px/1 var(--font-display); letter-spacing: .02em;
    color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent2)); transition: box-shadow var(--t), filter var(--t); white-space: nowrap; }
  .btn:hover { box-shadow: 0 0 calc(18px * var(--glow)) rgba(var(--acc-rgb), calc(.5 * var(--glow))); }
  .btn:disabled { opacity: .6; cursor: default; box-shadow: none; }
  .btn.ghost { background: var(--panel3); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .btn.ghost:hover { border-color: var(--accent); box-shadow: none; }
  .btn svg { width: 15px; height: 15px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--panel3); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line); background-clip: padding-box; border: 2px solid transparent; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  .iconbtn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--dim); flex: none; transition: background var(--t), color var(--t); }
  .iconbtn:hover { background: var(--panel3); color: var(--text); }
  .iconbtn svg { width: 17px; height: 17px; }
  /* ---------- раскладка как в Discord: слева лички, в середине «Друзья» или переписка, справа активные контакты ---------- */
  #bgfx { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; filter: blur(var(--bg-blur, 0px)); transform: scale(1.04); }
  #bgfx::after { content: ""; position: absolute; inset: 0; background: rgba(10, 11, 20, var(--bg-dim, .55)); }
  /* свои адреса спрятаны: копируются кнопкой, показать — по кнопке «показать» */
  .ip { filter: blur(5px); user-select: none; transition: filter .15s; }
  .showip .ip { filter: none; user-select: text; }
  .ipeye { font-size: 12px; color: var(--dim); text-decoration: underline dotted; background: none; border: 0; padding: 0 4px; cursor: pointer; }
  .ipeye:hover { color: var(--text); }
  body.hasbg { background: transparent; }
  body.hasbg aside, body.hasbg .rpanel { background: color-mix(in srgb, var(--panel) 82%, transparent); }
  body.hasbg main { background: color-mix(in srgb, var(--bg) 55%, transparent); }
  body.hasbg .m .t, body.hasbg .day, body.hasbg .gh, body.hasbg .chead, body.hasbg .ractempty, body.hasbg .mepanel, body.hasbg .gt { text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.55); }
  body.hasbg .m .t, body.hasbg .day, body.hasbg .gh span { color: color-mix(in srgb, var(--text) 72%, transparent); }
  body.hasbg .chead, body.hasbg form.send, body.hasbg .mepanel { background: color-mix(in srgb, var(--panel) 75%, transparent); backdrop-filter: blur(8px); }
  .wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .sfind { margin: 10px 10px 6px; }
  .sfind input { width: 100%; padding: 7px 10px; font-size: 13px; background: var(--bg); }
  .nav { display: flex; align-items: center; gap: 12px; margin: 2px 8px; padding: 9px 10px; border-radius: 8px; color: var(--dim); font-weight: 600; text-align: left; width: calc(100% - 16px); transition: background var(--t), color var(--t); }
  .nav:hover { background: var(--panel2); color: var(--text); }
  .nav.on { background: var(--panel3); color: var(--text); }
  .nav svg { width: 22px; height: 22px; }
  .nav .sp { flex: 1; }
  .sec { padding: 14px 18px 6px; color: var(--faint); font-size: 11.5px; font-weight: 700; letter-spacing: .03em; display: flex; align-items: center; }
  .sec span { flex: 1; }
  .sec button { color: var(--faint); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; } .sec button:hover { color: var(--text); }
  .sec button svg { width: 16px; height: 16px; }
  .list { flex: 1; overflow-y: auto; padding: 0 8px 10px; min-height: 0; }
  .dm { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; position: relative; color: var(--dim); transition: background var(--t), color var(--t); }
  .dm:hover { background: var(--panel2); color: var(--text); }
  .dm.on { background: var(--panel3); color: var(--text); }
  .dm .who { flex: 1; min-width: 0; }
  .dm .nm { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dm .st { font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dm.unread .nm { color: var(--text); }
  .dm .x { width: 22px; height: 22px; display: none; place-items: center; border-radius: 6px; color: var(--faint); flex: none; }
  .dm .x svg { width: 14px; height: 14px; }
  .dm:hover .x { display: grid; } .dm .x:hover { color: var(--text); background: var(--line); }
  .dm:hover .badge { display: none; }
  .ava { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font: 700 14px/1 var(--font-display); background-size: cover; background-position: center; position: relative; }
  .ava.big { width: 40px; height: 40px; font-size: 16px; }
  .ava .dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--faint); border: 2.5px solid var(--panel); }
  .ava .dot.online { background: var(--green); box-shadow: 0 0 calc(8px * var(--glow)) var(--green); }
  .ava .dot.idle { background: #f0b232; box-shadow: none; }
  .ava .dot.idle::after { content: ""; position: absolute; left: -1px; top: -1px; width: 6px; height: 6px; border-radius: 50%; background: var(--panel); }
  .ava .dot.voice { background: var(--accent); box-shadow: 0 0 calc(8px * var(--glow)) var(--accent); }
  .badge { min-width: 19px; height: 19px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; font: 700 11px/1 var(--font-display); color: var(--on-accent); flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .badge.red { background: var(--red); color: #fff; }
  /* моя панель внизу слева — как на серверах */
  .mepanel { display: flex; align-items: center; gap: 2px; padding: 8px; background: var(--bg); border-top: 1px solid var(--line); flex: none; }
  .mepanel .mebtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 4px 6px; border-radius: 8px; text-align: left; }
  .mepanel .mebtn:hover { background: var(--panel2); }
  .mepanel .mebtn b { display: block; font: 700 14px/1.2 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mepanel .mebtn span { display: block; font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mepanel .iconbtn.off { color: var(--red); }
  .devgrp { display: inline-flex; align-items: center; border-radius: 8px; flex: none; }
  .devgrp:hover { background: var(--panel2); }
  .devgrp .iconbtn:hover { background: none; }
  .devchev { width: 14px; height: 32px; display: grid; place-items: center; color: var(--dim); border-radius: 0 8px 8px 0; margin-left: -6px; }
  .devchev svg { width: 12px; height: 12px; transition: transform var(--t-fast, .12s); }
  .devchev:hover, .devchev.open { color: var(--text); background: var(--panel3); }
  .devchev.open svg { transform: rotate(180deg); }
  .devpop { position: fixed; z-index: 80; width: 280px; max-width: calc(100vw - 16px); padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(0,0,0,.55); }
  .devpop h4 { margin: 0 0 8px; font: 700 14px var(--font-display); }
  .devpop label, .vdlg .vl { display: block; color: var(--dim); font-size: 12.5px; margin: 12px 0 6px; }
  .devpop label b, .vdlg .vl b { color: var(--text); }
  .devpop input[type=range], .vdlg input[type=range] { width: 100%; accent-color: var(--accent); }
  .devlist { display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto; margin: 0 -6px; }
  .devlist button { display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px; border-radius: 8px; font-size: 13.5px; color: var(--text); }
  .devlist button:hover { background: var(--panel2); }
  .devlist button i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--faint); flex: none; }
  .devlist button.on i { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 3px, transparent 4px); }
  .devlist button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .devpop .hint, .vdlg .hint { font-size: 12px; color: var(--faint); margin: 8px 6px 0; }
  .devpop .vbmore { margin-top: 10px; font-size: 12.5px; color: var(--dim); text-decoration: underline dotted; }
  .devpop .vbmore:hover { color: var(--text); }
  dialog.kdlg.vdlg .kd-b { white-space: normal; }
  .vdlg .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .vdlg .seg button { flex: 1 1 auto; min-width: 0; padding: 8px 6px; font: 600 12.5px var(--font-display); color: var(--dim); overflow-wrap: normal; word-break: normal; hyphens: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vdlg .seg button.on { border-color: var(--accent); color: var(--text); background: rgba(var(--acc-rgb), .12); }
  .vdlg .chk { display: flex; align-items: center; gap: 9px; margin: 12px 0 0; font-size: 13.5px; }
  .vdlg .chk input { width: 17px; height: 17px; accent-color: var(--accent); }
  .vdlg details { margin-top: 12px; } .vdlg summary { cursor: pointer; color: var(--dim); font-size: 13px; } .vdlg summary:hover { color: var(--text); }
  /* главная «Друзья» */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .topbar { height: 52px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; flex: none; min-width: 0; }
  .topbar .ttl { display: flex; align-items: center; gap: 8px; font: 700 15px var(--font-display); padding-right: 10px; margin-right: 4px; border-right: 1px solid var(--line); }
  .topbar .ttl svg { width: 20px; height: 20px; color: var(--dim); }
  .tab { padding: 5px 11px; border-radius: 7px; color: var(--dim); font-weight: 600; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .tab:hover { background: var(--panel2); color: var(--text); }
  .tab.on { background: var(--panel3); color: var(--text); }
  .tab.add { color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .tab.add.on { background: transparent; color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .topbar .sp { flex: 1; }
  .homebody { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
  .flist { overflow-y: auto; padding: 14px 18px 18px 22px; min-height: 0; }
  .flist .search { width: 100%; margin-bottom: 14px; background: var(--bg); }
  .fcap { font-size: 11.5px; font-weight: 700; letter-spacing: .03em; color: var(--dim); padding: 4px 2px 10px; border-bottom: 1px solid var(--line); }
  .frow { display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; border-top: 1px solid transparent; position: relative; }
  .frow + .frow::before { content: ""; position: absolute; left: 8px; right: 8px; top: -1px; height: 1px; background: var(--line); }
  .frow:hover { background: var(--panel2); } .frow:hover::before, .frow:hover + .frow::before { opacity: 0; }
  .frow .who { flex: 1; min-width: 0; }
  .frow .nm { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .frow .nm small { font-weight: 500; color: var(--faint); font-size: 12.5px; display: none; }
  .frow:hover .nm small { display: inline; }
  .frow .st { font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .st .hl { color: var(--accent); }
  .frow .acts { display: flex; gap: 8px; }
  .rbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); color: var(--dim); transition: color var(--t), background var(--t); }
  .frow:hover .rbtn { background: var(--bg); }
  .rbtn:hover { color: var(--text); } .rbtn.ok:hover { color: var(--green); } .rbtn.no:hover { color: var(--red); }
  .rbtn svg { width: 18px; height: 18px; }
  .nobody { margin: 60px auto; text-align: center; color: var(--dim); max-width: 360px; }
  .nobody .big { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px; display: grid; place-items: center; color: var(--on-accent);
    background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 0 calc(28px * var(--glow)) rgba(var(--acc-rgb), calc(.45 * var(--glow))); }
  .nobody .big svg { width: 34px; height: 34px; }
  .addbox h2 { margin: 6px 0 6px; font: 700 18px var(--font-display); }
  .addbox p { margin: 0 0 14px; color: var(--dim); font-size: 14px; }
  .addform { display: flex; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
  .addform:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--acc-rgb), calc(.18 * var(--glow))); }
  .addform input, .addform input:focus, .addform input:focus-visible { outline: none; flex: 1; border: 0; background: none; box-shadow: none; padding: 6px 0; min-width: 0; }
  #addErr { font-size: 13px; margin-top: 8px; color: var(--red); min-height: 18px; }
  #addErr.ok { color: var(--green); }
  .mycode { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .mycode code { font: 600 14px var(--font-display); color: var(--accent); letter-spacing: .03em; padding: 3px 8px; border-radius: 6px; background: var(--panel2); }
  .mycode + .mycode { margin-top: 10px; padding-top: 0; border-top: 0; }
  .mycode:empty { display: none; }
  .near h3 { font: 700 12px var(--font-display); color: var(--dim); margin: 22px 0 8px; letter-spacing: .02em; }
  .near .nrow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--panel2); margin-bottom: 6px; }
  .near .nrow span { flex: 1; min-width: 0; } .near .nrow small { color: var(--dim); margin-left: 6px; }
  .mycode button { font-size: 12.5px; color: var(--dim); text-decoration: underline dotted; } .mycode button:hover { color: var(--text); }
  .rpanel { border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; min-height: 0; }
  .rpanel h3 { margin: 4px 0 14px; font: 700 18px var(--font-display); }
  .act { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: border-color var(--t); }
  .act:hover { border-color: rgba(var(--acc-rgb), .45); }
  .act .ah { display: flex; align-items: center; gap: 10px; }
  .act .ah b { display: block; font-weight: 700; } .act .ah span { display: block; font-size: 12.5px; color: var(--dim); }
  .act .ab { margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; background: var(--bg); font-size: 13px; }
  .act .ab svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
  .act .ab b { display: block; } .act .ab span { color: var(--dim); font-size: 12px; }
  .ractempty { text-align: center; color: var(--dim); font-size: 13.5px; padding: 16px 6px; }
  .ractempty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  @media (max-width: 1100px) { .homebody { grid-template-columns: minmax(0, 1fr); } .rpanel { display: none; } }
  @media (max-width: 760px) { .topbar .ttl span { display: none; } .tab { padding: 5px 8px; } }
  /* мини-профиль */
  .card { position: fixed; z-index: 40; width: 300px; border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 18px 44px rgba(0,0,0,.55), 0 0 calc(24px * var(--glow)) rgba(var(--acc-rgb), calc(.12 * var(--glow))); animation: cpop .14s ease-out; }
  @keyframes cpop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  [data-motion="off"] .card { animation: none; }
  .card .ban { height: 70px; }
  .card .cav { margin: -36px 0 0 14px; width: 76px; height: 76px; font-size: 28px; border: 5px solid var(--panel); box-sizing: content-box; }
  .card .cav .dot { width: 16px; height: 16px; border-width: 4px; right: 0; bottom: 0; }
  .card .cb { padding: 8px 16px 16px; }
  .card .cn { font: 700 20px/1.2 var(--font-display); }
  .card .cs { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .card .cbio { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .card .cbio i { display: block; font-style: normal; font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: .03em; margin-bottom: 4px; }
  .card .cacts { display: flex; gap: 8px; margin-top: 12px; } .card .cacts .btn { flex: 1; }
  /* меню «⋮» */
  .menu { position: fixed; z-index: 45; min-width: 210px; padding: 6px; border-radius: 12px; background: var(--panel); border: 1px solid rgba(var(--acc-rgb), .35);
    box-shadow: 0 14px 34px rgba(0,0,0,.55); animation: cpop .12s ease-out; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 14px; }
  .menu button:hover { background: rgba(var(--acc-rgb), .14); } .menu button svg { width: 16px; height: 16px; color: var(--dim); }
  .menu button.danger { color: var(--red); } .menu button.danger svg { color: var(--red); }
  .menu button:disabled { opacity: .45; cursor: default; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
  .menu .mquick { display: flex; gap: 2px; padding: 2px 2px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .menu .mquick button { width: 34px; height: 34px; padding: 0; justify-content: center; font-size: 19px; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  .rq { display: flex; gap: 6px; align-items: baseline; max-width: 100%; margin: 2px 0 3px; padding: 3px 9px; border-left: 3px solid rgba(var(--acc-rgb), .7); border-radius: 4px 8px 8px 4px; background: rgba(var(--acc-rgb), .07); font-size: 12.5px; color: var(--dim); cursor: pointer; overflow: hidden; }
  .rq b { color: var(--text); font-weight: 700; flex: none; } .rq span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .rq:hover { background: rgba(var(--acc-rgb), .13); }
  .m.me .rq { align-self: flex-end; }
  .ftray { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 16px -4px; padding: 8px; border-radius: 10px 10px 0 0; background: var(--panel2); border: 1px solid var(--line); border-bottom: 0; }
  .ftray[hidden] { display: none; }
