# Сборка Кентовки для Android на GitHub (Actions → «Android APK» → Run workflow, или при каждом пуше)
# Ключ подписи: секрет ANDROID_KEYSTORE_B64 (base64 от .jks) и ANDROID_KEYSTORE_PASS.
# Если секрета нет — APK подписывается временным ключом (ставится, но обновление поверх старого не встанет).
# Вторая задача — проверка в эмуляторе: ставит отладочную сборку, заходит на тестовый сервер,
# снимает экран и журнал и кладёт их в ветку ci-results.
name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'public/**', 'server.js', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        run: bash android/ci-build.sh release
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - uses: actions/upload-artifact@v4
        with: { name: Kentovka-android, path: android/build/Kentovka.apk }
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Debug build
        run: bash android/ci-build.sh debug
      - name: Test server
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p /tmp/kd
          nohup node -e "require('./server').startServer({port:8443,dataDir:'/tmp/kd'}).then(()=>console.log('up'))" > /tmp/srv.log 2>&1 &
          sleep 3; cat /tmp/srv.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash android/ci-test.sh
      - name: Results to branch ci-results
        if: always()
        run: |
          cp /tmp/srv.log ci-out/server.log 2>/dev/null || true
          cd ci-out && git init -q && git checkout -q -b ci-results
          echo "run ${{ github.run_id }} commit ${{ github.sha }}" > RUN.txt
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
